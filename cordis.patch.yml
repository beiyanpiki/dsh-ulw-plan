# dsh-omo bundle patch: one Host row over the profile.
#
# The row loads the package's main entry as a plain Cordis plugin. Everything
# the plugin contributes (projection, guard, command, tools, skills, presets)
# is registered on the Host plane from `lib/index.js`, so no shipped preset is
# taken over and no per-session composition is needed.
- insert:
    - id: omo
      name: dsh-omo
