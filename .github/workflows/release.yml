name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Test
        run: node --test

      # CI publishes directly - no staged approval step.
      # Preferred: npm Trusted Publisher (OIDC); configure once on npmjs.com
      #   package -> Settings -> Trusted Publishing -> GitHub Actions:
      #   owner beiyanpiki, repo dsh-ulw-plan, workflow release.yml, environment empty.
      # Fallback: NPM_TOKEN holding a classic Automation token (bypass 2FA).
      - name: Publish to npm
        env:
          NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          echo "npm $(npm --version)"
          # Prefer Trusted Publisher (OIDC): no long-lived token on the runner.
          if npm publish --access public --provenance; then
            echo "Published with Trusted Publisher (OIDC)."
            exit 0
          fi
          if [ -n "${NPM_TOKEN_VALUE:-}" ]; then
            echo "::warning::OIDC publish failed; retrying with NPM_TOKEN"
            NODE_AUTH_TOKEN="$NPM_TOKEN_VALUE" npm publish --access public --provenance
            exit $?
          fi
          echo "::error::npm publish failed. Configure a Trusted Publisher for beiyanpiki/dsh-ulw-plan (workflow release.yml) or set NPM_TOKEN to an Automation token."
          exit 1
